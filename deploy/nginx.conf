# Deva Web 反向代理(放 nginx 的 http 上下文内,如 /etc/nginx/conf.d/deva.conf)。
# 前提(web-migration-plan.md §11.3):
# - 证书存在后才启用 443 server;首次发证先用仅 HTTP 的 ACME 配置 + certbot webroot。
# - 应用侧 DEVA_WEB_ORIGIN 必须与本文件 server_name 一致。
# - 关闭 7421 的公网入口,Node 仅监听 127.0.0.1。

map $http_upgrade $deva_connection_upgrade {
    default upgrade;
    '' close;
}

log_format deva '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    server_name deva.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/deva-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name deva.example.com;

    ssl_certificate     /etc/letsencrypt/live/deva.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deva.example.com/privkey.pem;

    # 附件/技能上传上限 40 MiB(应用内单笔 8 MiB,上传类 40 MiB)
    client_max_body_size 40m;
    access_log /var/log/nginx/deva-access.log deva;

    location / {
        proxy_pass http://127.0.0.1:7421;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       $deva_connection_upgrade;
        # 终端/流式回复是长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# 注意:模板假设只有一层 nginx(X-Forwarded-For 覆盖客户端值);前面还有 CDN/负载均衡时
# 需重新配置可信代理与 IP 限流并验证。header/CSP 由应用按页面/API/交付物类别设置,
# 不要在 nginx 全局加 CSP,避免与文件预览冲突。
